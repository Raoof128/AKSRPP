# TEST: Privileged container should FAIL
# Expected: Admission denied by deny-privileged-containers policy
apiVersion: v1
kind: Pod
metadata:
  name: test-privileged-fail
  namespace: default
  labels:
    app: test
    owner: security-team
    environment: test
spec:
  serviceAccountName: test-sa
  automountServiceAccountToken: false
  containers:
  - name: nginx
    image: docker.io/nginx:1.25.0
    securityContext:
      privileged: true  # VIOLATION: Privileged container
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"
