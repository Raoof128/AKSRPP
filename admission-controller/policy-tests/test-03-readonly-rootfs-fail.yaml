# TEST: Container without read-only rootfs should FAIL
# Expected: Admission denied by require-readonly-rootfs policy
apiVersion: v1
kind: Pod
metadata:
  name: test-writable-fs-fail
  namespace: default
  labels:
    app: test
    owner: security-team
    environment: test
spec:
  serviceAccountName: test-sa
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: docker.io/nginx:1.25.0
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      # VIOLATION: readOnlyRootFilesystem not set to true
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"
