# TEST: Pod with hostPath volume should FAIL
# Expected: Admission denied by deny-host-path policy
apiVersion: v1
kind: Pod
metadata:
  name: test-hostpath-fail
  namespace: default
  labels:
    app: test
    owner: security-team
    environment: test
spec:
  serviceAccountName: test-sa
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  volumes:
  - name: host-volume
    hostPath:  # VIOLATION: Using hostPath
      path: /var/lib/malicious
      type: Directory
  containers:
  - name: app
    image: docker.io/nginx:1.25.0
    volumeMounts:
    - name: host-volume
      mountPath: /data
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"
