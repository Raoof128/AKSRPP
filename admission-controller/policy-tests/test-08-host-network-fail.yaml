# TEST: Pod with hostNetwork should FAIL
# Expected: Admission denied by deny-host-namespaces policy
apiVersion: v1
kind: Pod
metadata:
  name: test-hostnetwork-fail
  namespace: default
  labels:
    app: test
    owner: security-team
    environment: test
spec:
  hostNetwork: true  # VIOLATION: Using host network
  serviceAccountName: test-sa
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: docker.io/nginx:1.25.0
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"
