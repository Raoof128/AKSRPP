apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdenydefaultsa
  annotations:
    description: >-
      Blocks use of default ServiceAccount. Forces explicit ServiceAccount
      creation implementing least privilege principle.
    severity: MEDIUM
spec:
  crd:
    spec:
      names:
        kind: K8sDenyDefaultSA
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdenydefaultsa

        violation[{"msg": msg}] {
          spec := get_spec
          sa_name := object.get(spec, "serviceAccountName", "default")
          sa_name == "default"
          msg := "Pods must not use the default ServiceAccount. Create a dedicated ServiceAccount."
        }

        violation[{"msg": msg}] {
          spec := get_spec
          not spec.serviceAccountName
          spec.automountServiceAccountToken == true
          msg := "Pod uses default ServiceAccount with auto-mounted token. Specify explicit ServiceAccount."
        }

        get_spec = spec {
          input.review.kind.kind == "Pod"
          spec := input.review.object.spec
        }

        get_spec = spec {
          input.review.kind.kind in ["Deployment", "StatefulSet", "DaemonSet"]
          spec := input.review.object.spec.template.spec
        }
