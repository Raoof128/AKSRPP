apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequirereadonlyrootfs
  annotations:
    description: >-
      Requires read-only root filesystem for containers. Prevents attackers
      from modifying binaries or installing malware after container compromise.
    severity: MEDIUM
spec:
  crd:
    spec:
      names:
        kind: K8sRequireReadOnlyRootFS
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sreadonlyrootfs

        violation[{"msg": msg}] {
          container := get_containers[_]
          not container.securityContext.readOnlyRootFilesystem == true
          msg := sprintf("Container %v must have readOnlyRootFilesystem: true", [container.name])
        }

        get_containers[container] {
          input.review.kind.kind == "Pod"
          container := input.review.object.spec.containers[_]
        }

        get_containers[container] {
          input.review.kind.kind in ["Deployment", "StatefulSet", "DaemonSet"]
          container := input.review.object.spec.template.spec.containers[_]
        }
