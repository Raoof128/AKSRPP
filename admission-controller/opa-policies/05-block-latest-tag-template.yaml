apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sblocklatesttag
  annotations:
    description: >-
      Blocks use of 'latest' or untagged container images. Ensures
      reproducible deployments and prevents accidental use of untested images.
    severity: HIGH
spec:
  crd:
    spec:
      names:
        kind: K8sBlockLatestTag
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sblocklatesttag

        violation[{"msg": msg}] {
          container := get_containers[_]
          image := container.image
          uses_latest_tag(image)
          msg := sprintf("Container %v uses :latest or no tag: %v. Use explicit version tags.",
            [container.name, image])
        }

        get_containers[container] {
          input.review.kind.kind == "Pod"
          container := input.review.object.spec.containers[_]
        }

        get_containers[container] {
          input.review.kind.kind in ["Deployment", "StatefulSet", "DaemonSet", "Job", "CronJob"]
          container := input.review.object.spec.template.spec.containers[_]
        }

        uses_latest_tag(image) {
          endswith(image, ":latest")
        }

        uses_latest_tag(image) {
          not contains(image, ":")
          contains(image, "/")
        }

        uses_latest_tag(image) {
          # Image with no tag and no slash (e.g., "nginx")
          not contains(image, ":")
          not contains(image, "@")
        }
