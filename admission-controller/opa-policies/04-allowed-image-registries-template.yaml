apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sallowedregistries
  annotations:
    description: >-
      Restricts container images to approved registries. Prevents supply chain
      attacks by ensuring all images come from trusted sources.
    severity: CRITICAL
spec:
  crd:
    spec:
      names:
        kind: K8sAllowedRegistries
      validation:
        openAPIV3Schema:
          type: object
          properties:
            allowedRegistries:
              description: List of allowed container registries
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sallowedregistries

        violation[{"msg": msg}] {
          container := get_containers[_]
          image := container.image
          not registry_allowed(image)
          msg := sprintf("Container %v uses disallowed registry: %v. Allowed registries: %v",
            [container.name, image, input.parameters.allowedRegistries])
        }

        get_containers[container] {
          input.review.kind.kind == "Pod"
          container := input.review.object.spec.containers[_]
        }

        get_containers[container] {
          input.review.kind.kind == "Pod"
          container := input.review.object.spec.initContainers[_]
        }

        get_containers[container] {
          input.review.kind.kind in ["Deployment", "StatefulSet", "DaemonSet", "Job", "CronJob"]
          container := input.review.object.spec.template.spec.containers[_]
        }

        get_containers[container] {
          input.review.kind.kind in ["Deployment", "StatefulSet", "DaemonSet", "Job", "CronJob"]
          container := input.review.object.spec.template.spec.initContainers[_]
        }

        registry_allowed(image) {
          registry := input.parameters.allowedRegistries[_]
          startswith(image, registry)
        }

        # Allow images without explicit registry (assumes Docker Hub or local)
        registry_allowed(image) {
          not contains(image, "/")
          count(input.parameters.allowedRegistries) == 0
        }
