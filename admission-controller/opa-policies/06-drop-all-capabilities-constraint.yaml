apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sDropAllCapabilities
metadata:
  name: drop-all-capabilities
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet"]
    excludedNamespaces:
      - kube-system
      - gatekeeper-system
  parameters:
    allowedCapabilities:
      # Minimal allowed capabilities - add only if absolutely required
      - "NET_BIND_SERVICE"  # Bind to ports < 1024
      - "CHOWN"             # Change file ownership (use sparingly)
